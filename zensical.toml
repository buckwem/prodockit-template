# ============================================================================
#
# The configuration produced by default is meant to highlight the features
# that Zensical provides and to serve as a starting point for your own
# projects.
#
# ============================================================================

[project]

# The site_name is shown in the page header and the browser window title
#
# Read more: https://zensical.org/docs/setup/basics/#site_name
site_name = "Document Template"

# The site_description is included in the HTML head and should contain a
# meaningful description of the site content for use by search engines.
#
# Read more: https://zensical.org/docs/setup/basics/#site_description
site_description = "A template for professional and academic reports using Zensical."

# The site_author attribute. This is used in the HTML head element.
#
# Read more: https://zensical.org/docs/setup/basics/#site_author
site_author = "Mark Buckwell"

# The site_url is the canonical URL for your site. When building online
# documentation you should set this.
# Read more: https://zensical.org/docs/setup/basics/#site_url
site_url = "https://buckwem.github.io/prodockit-template/"
site_dir = "public"

repo_url = "https://github.com/buckwem/prodockit-template"
repo_name = "prodockit-template"
edit_uri = "edit/main/docs/"

# The copyright notice appears in the page footer and can contain an HTML
# fragment.
#
# Read more: https://zensical.org/docs/setup/basics/#copyright
# copyright = """
# Copyright &copy; 2026 <copyright holder>
# """
copyright = """
Author: Mark Buckwell and contributors. Licensed under the MIT License.
"""

# Zensical supports both implicit navigation and explicitly defined navigation.
# If you decide not to define a navigation here then Zensical will simply
# derive the navigation structure from the directory structure of your
# "docs_dir". The definition below demonstrates how a navigation structure
# can be defined using TOML syntax.
#
# Read more: https://zensical.org/docs/setup/navigation/
nav = [
  {"Cover" = [
    "index.md",
  ]},
  {"Originality" = [
    {"1. Originality & AI Use" = "originality.md"}
  ]},
  {"Assignment" = [
    {"2. Executive Summary" = "section1.md"},
    {"3. Requirements" = "section2.md"},
    {"4. Solution Architecture" = "section3.md"},
    {"5. Governance" = "section4.md"},
    {"6. Examples DELETE" = "section5.md"}
  ]},
  {"Appendixes" = [
    {"Appendix A. Acronyms" = "acronyms.md"},
    {"Appendix B. Glossary" = "glossary.md"},
    {"Appendix C. References" = "references.md"},
    {"Appendix D. Bibliography" = "bibliography.md"}
  ]}
]

# With the "extra_css" option you can add your own CSS styling to customize
# your Zensical project according to your needs. You can add any number of
# CSS files.
#
# The path provided should be relative to the "docs_dir".
#
# Read more: https://zensical.org/docs/customization/#additional-css
#
extra_css = ["stylesheets/extra.css", "stylesheets/template.css"]

# With the `extra_javascript` option you can add your own JavaScript to your
# project to customize the behavior according to your needs.
#
# The path provided should be relative to the "docs_dir".
#
# Read more: https://zensical.org/docs/customization/#additional-javascript
#extra_javascript = ["javascripts/extra.js"]
#
# Order is load-bearing. MathJax reads `window.MathJax` once at startup, so
# its configuration has to be listed *before* the bundle - a config that
# arrives afterwards is ignored, and the page shows raw TeX rather than an
# equation (prodockit-extensions#263).
#
# Both MathJax entries are installed by `prodockit bootstrap` and ignored
# by git: the bundle is third-party code and does not belong in your
# repository, and it is copied out of tools/mathjax's own pinned install so
# the website and the PDF typeset through byte-identical MathJax. Run
# `prodockit bootstrap --apply` (or see the User Guide) before building the
# site for the first time.
extra_javascript = [
  # Cache keys are intentional. A browser that saw the old config kept
  # serving raw TeX even after the corrected generated file was deployed;
  # these revisions make that change visible without asking every reader to
  # clear all site data. Change the relevant key when either generated file
  # changes again.
  "javascripts/mathjax.js?v=config-2",
  "javascripts/vendor/mathjax/tex-svg-full.js?v=3.2.2",
  "javascripts/extra.js"
]

# ----------------------------------------------------------------------------
# Section for configuring theme options
# ----------------------------------------------------------------------------
[project.theme]

# Logo is set in the extra.css file for light and dark mode.
# Leave this set by default to use the Zensical logo. You can also set your own logo here.
logo = "assets/logo_black.png"

# change this to "classic" to use the traditional Material for MkDocs look.
#variant = "classic"

# Zensical allows you to override specific blocks, partials, or whole
# templates as well as to define your own templates. To do this, uncomment
# the custom_dir setting below and set it to a directory in which you
# keep your template overrides.
#
# Read more:
# - https://zensical.org/docs/customization/#extending-the-theme
#
custom_dir = "overrides"

# With the "favicon" option you can set your own image to use as the icon
# browsers will use in the browser title bar or tab bar. The path provided
# must be relative to the "docs_dir".
#
# Read more:
# - https://zensical.org/docs/setup/logo-and-icons/#favicon
# - https://developer.mozilla.org/en-US/docs/Glossary/Favicon
#
#favicon = "images/favicon.png"

# Zensical supports more than 60 different languages. This means that the
# labels and tooltips that Zensical's templates produce are translated.
# The "language" option allows you to set the language used. This language
# is also indicated in the HTML head element to help with accessibility
# and guide search engines and translation tools.
#
# The default language is "en" (English). It is possible to create
# sites with multiple languages and configure a language selector. See
# the documentation for details.
#
# Read more:
# - https://zensical.org/docs/setup/language/
#
language = "en"

# Zensical provides a number of feature toggles that change the behavior
# of the documentation site.
features = [
    # Zensical includes an announcement bar. This feature allows users to
    # dismiss it when they have read the announcement.
    # https://zensical.org/docs/setup/header/#announcement-bar
    "announce.dismiss",

    # If you have a repository configured and turn on this feature, Zensical
    # will generate an edit button for the page. This works for common
    # repository hosting services.
    # https://zensical.org/docs/setup/repository/#content-actions
    # "content.action.edit",

    # If you have a repository configured and turn on this feature, Zensical
    # will generate a button that allows the user to view the Markdown
    # code for the current page.
    # https://zensical.org/docs/setup/repository/#content-actions
    "content.action.view",

    # Code annotations allow you to add an icon with a tooltip to your
    # code blocks to provide explanations at crucial points.
    # https://zensical.org/docs/authoring/code-blocks/#code-annotations
    "content.code.annotate",

    # This feature turns on a button in code blocks that allow users to
    # copy the content to their clipboard without first selecting it.
    # https://zensical.org/docs/authoring/code-blocks/#code-copy-button
    "content.code.copy",

    # Code blocks can include a button to allow for the selection of line
    # ranges by the user.
    # https://zensical.org/docs/authoring/code-blocks/#code-selection-button
    "content.code.select",

    # Zensical can render footnotes as inline tooltips, so the user can read
    # the footnote without leaving the context of the document.
    # https://zensical.org/docs/authoring/footnotes/#footnote-tooltips
    "content.footnote.tooltips",

    # If you have many content tabs that have the same titles (e.g., "Python",
    # "JavaScript", "Cobol"), this feature causes all of them to switch to
    # at the same time when the user chooses their language in one.
    # https://zensical.org/docs/authoring/content-tabs/#linked-content-tabs
    "content.tabs.link",

    # With this feature enabled users can add tooltips to links that will be
    # displayed when the mouse pointer hovers the link.
    # https://zensical.org/docs/authoring/tooltips/#improved-tooltips
    "content.tooltips",

    # With this feature enabled, Zensical will automatically hide parts
    # of the header when the user scrolls past a certain point.
    # https://zensical.org/docs/setup/header/#automatic-hiding
    # "header.autohide",

    # Turn on this feature to expand all collapsible sections in the
    # navigation sidebar by default.
    # https://zensical.org/docs/setup/navigation/#navigation-expansion
    # "navigation.expand",

    # This feature turns on navigation elements in the footer that allow the
    # user to navigate to a next or previous page.
    # https://zensical.org/docs/setup/footer/#navigation
    "navigation.footer",

    # When section index pages are enabled, documents can be directly attached
    # to sections, which is particularly useful for providing overview pages.
    # https://zensical.org/docs/setup/navigation/#section-index-pages
    "navigation.indexes",

    # When instant navigation is enabled, clicks on all internal links will be
    # intercepted and dispatched via XHR without fully reloading the page.
    # https://zensical.org/docs/setup/navigation/#instant-navigation
    "navigation.instant",

    # With instant prefetching, your site will start to fetch a page once the
    # user hovers over a link. This will reduce the perceived loading time
    # for the user.
    # https://zensical.org/docs/setup/navigation/#instant-prefetching
    "navigation.instant.prefetch",

    # In order to provide a better user experience on slow connections when
    # using instant navigation, a progress indicator can be enabled.
    # https://zensical.org/docs/setup/navigation/#progress-indicator
    #"navigation.instant.progress",

    # When navigation paths are activated, a breadcrumb navigation is rendered
    # above the title of each page
    # https://zensical.org/docs/setup/navigation/#navigation-path
    # "navigation.path",

    # When pruning is enabled, only the visible navigation items are included
    # in the rendered HTML, reducing the size of the built site by 33% or more.
    # https://zensical.org/docs/setup/navigation/#navigation-pruning
    #"navigation.prune",

    # When sections are enabled, top-level sections are rendered as groups in
    # the sidebar for viewports above 1220px, but remain as-is on mobile.
    # https://zensical.org/docs/setup/navigation/#navigation-sections
    "navigation.sections",

    # When tabs are enabled, top-level sections are rendered in a menu layer
    # below the header for viewports above 1220px, but remain as-is on mobile.
    # https://zensical.org/docs/setup/navigation/#navigation-tabs
    "navigation.tabs",

    # When sticky tabs are enabled, navigation tabs will lock below the header
    # and always remain visible when scrolling down.
    # https://zensical.org/docs/setup/navigation/#sticky-navigation-tabs
    "navigation.tabs.sticky",

    # A back-to-top button can be shown when the user, after scrolling down,
    # starts to scroll up again.
    # https://zensical.org/docs/setup/navigation/#back-to-top-button
    "navigation.top",

    # When anchor tracking is enabled, the URL in the address bar is
    # automatically updated with the active anchor as highlighted in the table
    # of contents.
    # https://zensical.org/docs/setup/navigation/#anchor-tracking
    "navigation.tracking",

    # When search highlighting is enabled and a user clicks on a search result,
    # Zensical will highlight all occurrences after following the link.
    # https://zensical.org/docs/setup/search/#search-highlighting
    "search.highlight",

    # When anchor following for the table of contents is enabled, the sidebar
    # is automatically scrolled so that the active anchor is always visible.
    # https://zensical.org/docs/setup/navigation/#anchor-following
    # "toc.follow",

    # When navigation integration for the table of contents is enabled, it is
    # always rendered as part of the navigation sidebar on the left.
    # https://zensical.org/docs/setup/navigation/#navigation-integration
    "toc.integrate",
]

# ----------------------------------------------------------------------------
# In the "palette" subsection you can configure options for the color scheme.
# You can configure different color # schemes, e.g., to turn on dark mode,
# that the user can switch between. Each color scheme can be further
# customized.
#
# Read more:
# - https://zensical.org/docs/setup/colors/
# Light by default (issue #121: closer to how the document itself looks),
# not following the visitor's OS/browser dark-mode preference - Zensical's
# base.html template always server-renders the *first* palette entry
# (`{% set palette = palette | first %}`) regardless of any `media` query,
# but each entry's own `media` still drives client-side JS to immediately
# auto-switch after that first paint if it matches - so with both entries
# carrying a `prefers-color-scheme` query (the previous config), a visitor
# whose OS is set to dark saw a light page flash to dark a moment after
# load. Dropping `media` from both entries here makes the toggle purely
# manual: the first entry (light) is what loads and what stays, until a
# visitor clicks to switch - matching a document's own fixed appearance
# rather than following system preference.

# Palette toggle for light mode - listed first, so this is what's shown by
# default (see the note above).
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# In the "font" subsection you can configure the fonts used. By default, fonts
# are loaded from Google Fonts, giving you a wide range of choices from a set
# of suitably licensed fonts. There are options for a normal text font and for
# a monospaced font used in code blocks.
# ----------------------------------------------------------------------------
#[project.theme.font]
#text = "Inter"
#code = "Jetbrains Mono"

# ----------------------------------------------------------------------------
# You can configure your own logo to be shown in the header using the "logo"
# option in the "icons" subsection. The logo can be a path to a file in your
# "docs_dir" or it can be a path to an icon.
#
# Likewise, you can customize the logo used for the repository section of the
# header. Zensical derives the default logo for this from the repository URL.
# See below...
#
# There are other icons you can customize. See the documentation for details.
#
# Read more:
# - https://zensical.org/docs/setup/logo-and-icons
# - https://zensical.org/docs/authoring/icons-emojis/#search
# ----------------------------------------------------------------------------
[project.theme.icon]
edit = "lucide/pencil"
view = "lucide/eye"
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
note = "fontawesome/solid/note-sticky"
abstract = "fontawesome/solid/book"
info = "fontawesome/solid/circle-info"
tip = "fontawesome/solid/bullhorn"
success = "fontawesome/solid/check"
question = "fontawesome/solid/circle-question"
warning = "fontawesome/solid/triangle-exclamation"
failure = "fontawesome/solid/bomb"
danger = "fontawesome/solid/skull"
bug = "fontawesome/solid/robot"
example = "fontawesome/solid/flask"
quote = "fontawesome/solid/quote-left"

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
#[[project.extra.social]]
#icon = "fontawesome/brands/github"
#link = "https://github.com/user/repo"

[project.extra]
# Stylesheet meant only for the PDF build (e.g. rules that would look wrong
# on the live website) - concatenated after extra_css above, so it wins the
# cascade against a same-specificity extra_css rule. Requires prodockit>=0.6.8.
pdf_extra_css = ["stylesheets/print.css"]

# Set to false to turn off automatic sequential heading numbering (e.g. "7.2.1")
# on both the website and the PDF build. When false, headings show as plain
# text with no number prefix anywhere (content or sidebar).
heading_numbering = true

# Controls the layout of entries on the References page (docs/references.md),
# on both the website and the PDF build:
#   "european" (default) - single line spacing throughout, no indent, entries
#                           close together.
#   "global"              - single line spacing within each entry, double
#                           spacing between entries, with a 0.5in/1.27cm
#                           hanging indent on wrapped lines (the common
#                           APA/MLA/Chicago style).
reference_style = "european"

# The spacing/indent values behind reference_style above, on both the
# website and the PDF build - also used, unconditionally, for the Acronyms
# and Glossary pages' own list spacing (docs/acronyms.md, docs/glossary.md),
# which share the same tight "european" look but have no "global"-style
# alternative to switch to. Accepts any valid CSS length. See "References
# and bibliography" in customise.md.
reference_spacing_european = "-0.8em"  # gap between entries, "european" style
reference_indent_global = "1.27cm"     # hanging indent on wrapped lines, "global" style
reference_spacing_global = "2em"       # gap between entries, "global" style

# The PDF's page size (see "Page size and margins" in customise.md). Accepts
# any standard CSS page size (e.g. "letter", "legal", "A3") or explicit
# dimensions (e.g. "21cm 29.7cm"), optionally followed by "landscape".
# PDF-only, has no effect on the live site.
pdf_page_size = "A4"

# The PDF's page margins, one per side - each accepts any valid CSS length
# (e.g. "2cm", "0.75in"). The running header/footer live inside this margin,
# so shrinking a side also narrows the space available to them there. See
# "Page size and margins" in customise.md. PDF-only, has no effect on the
# live site.
#
# pdf_margin_bottom is deeper than the others: the two-line footer
# (copyright + "Made with" credit) is top-aligned in this margin and grows
# downward, so whatever the margin doesn't use is what's left before the
# paper edge. At 2cm that left only 4.0mm - inside what most consumer/office
# printers physically cannot print (commonly 5-6.4mm) - so the second line
# would be clipped on paper even though the PDF itself is correct (issue
# #151). 2.75cm measured at 11.5mm clearance here, comfortably past that
# floor; prodockit-extensions' own default is 2.5cm (extensions#139), but
# this project's footer text starts from a tighter baseline, so it needs
# more than the same absolute bump to land in the same comfortable range.
# If the footer ever gains a third line, re-measure - this doesn't scale
# automatically.
pdf_margin_top = "2cm"
pdf_margin_right = "2cm"
pdf_margin_bottom = "2.75cm"
pdf_margin_left = "2cm"

# The PDF's running header/footer text style (see "Page header"/"Page
# footer" in customise.md). Each accepts any valid CSS value (e.g. "9pt",
# "rgb(85, 85, 85)"). One setting each for header and footer together - PDF
# only, has no effect on the live site.
pdf_header_footer_font_size = "10pt"
pdf_header_footer_color = "#555555"
pdf_header_footer_divider_color = "#e2e8f0"

# Overrides `copyright` above for the PDF's own running footer only - the
# live website's copyright text is untouched either way. Repeats the same
# text `copyright` has, plus one extra line crediting the PDF pipeline
# itself, matching the same "Made with Zensical and prodockit" line the
# live website's own footer already shows (see overrides/partials/
# copyright.html). A real HTML fragment - a real <br> forces the line
# break, and the two <a> links render as real, clickable links in the
# PDF, not flattened to plain text - see prodockit-extensions' pdf.md
# "Copyright text" docs. Removing just this one line falls back to a
# plain `copyright`-only footer without touching the license text
# itself. Requires prodockit>=0.9.0.
pdf_copyright = 'Author: Mark Buckwell and contributors. Licensed under the MIT License.<br>Made with <a href="https://zensical.org/">Zensical</a> and <a href="https://buckwem.github.io/prodockit-extensions/">prodockit</a>.'


# Generating a PDF bundle of the source (Markdown + zensical.toml) is now a
# separate command, `prodockit source-bundle`, run alongside `prodockit pdf`
# rather than a setting here - see CONTRIBUTING.md and the CI workflow
# files. Requires prodockit>=0.21.0.

# ----------------------------------------------------------------------------
# Python Extensions
#
# Read more:
# - https://zensical.org/docs/setup/extensions/python-markdown-extensions/#arithmatex-zensicaltoml
# ----------------------------------------------------------------------------
# Below is a list of the default and supported python Markdown extensions that Zensical supports.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = ["overrides/.icons"]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# You can add your own custom Markdown extensions here. You can also configure the extensions that Zensical uses by default. See the documentation for details.
[project.markdown_extensions.tables]
# prodockit.headings gives every heading an id and a hierarchical section
# number (reusing the "toc" extension above for the id/permalink, rather
# than re-deriving it); prodockit.refs adds \ref{id} section cross-references
# that resolve to the target's current number; prodockit.bibliography adds
# \cite{id} citations, resolved against references.bib (see below) and
# formatted via Pandoc's own --citeproc, plus a \bibliography marker that
# generates a reference list - split across two pages/files: docs/
# references.md's \bibliography{}{true} lists only sources actually
# \cite{}-cited (from references.bib, the bib_file configured below),
# and docs/bibliography.md's \bibliography{bibliography.bib} lists every
# further-reading source in that separate file regardless of citation
# status - issue #118 replaced this template's earlier
# prodockit.citations-based approach (hand-typed \citeref{id} paragraphs)
# with this one, since editing one .bib
# entry now updates every citation of it, and the CSL style is swappable
# in one place; prodockit.glossary adds \gls{id} - define a term once via
# attr_list's data-term attribute (see docs/acronyms.md/docs/glossary.md),
# insert it anywhere; prodockit.tables adds a width attribute to
# attr_list-tagged table header cells; prodockit.index adds \index{Term}
# markers for prodockit.pdf's own PDF-only back-of-book index (opt-in -
# unset here, so marking a term doesn't turn the index page on by itself;
# set pdf_include_index = true under [project.extra] to enable it). Unlike
# pymdownx/zensical's own namespaces, Zensical doesn't hoist a nested
# "prodockit.headings" table into that dotted extension name, so these
# need a quoted key instead - see
# https://buckwem.github.io/prodockit-extensions/ and prodockit-template#25/#87/#118.
[project.markdown_extensions."prodockit.headings"]
# numbering = "continuous" makes h1 numbering carry on across pages in nav
# order (page two's first h1 continues from wherever page one left off)
# instead of restarting at 1 on every page - matching the sidebar numbering
# in nav (see "Changing heading numbering" in customise.md) and fixing
# \ref{}'s cross-page number (prodockit-template#89). A page whose front
# matter sets is_appendix: true (see "Appendixes" in customise.md) gets
# letter-based numbering instead, and doesn't consume a number from the
# sequence.
numbering = "continuous"
[project.markdown_extensions."prodockit.refs"]
[project.markdown_extensions."prodockit.glossary"]
[project.markdown_extensions."prodockit.bibliography"]
# bib_file/csl_style are both resolved relative to wherever
# `zensical build`/`zensical serve`/`prodockit pdf` is run from - typically
# the project root, where references.bib lives. harvard-cite-them-right.csl
# isn't committed (see CONTRIBUTING.md's "Getting set up") - fetch it before
# building. Requires Pandoc on PATH - unlike every other prodockit
# extension, this one needs it even for the live website, not just the
# PDF (see "Requirements" in prodockit.bibliography's own docs).
bib_file = "references.bib"
csl_style = "harvard-cite-them-right.csl"
[project.markdown_extensions."prodockit.tables"]
[project.markdown_extensions."prodockit.index"]
# A directory listing that reads as one: indentation is the structure, a
# trailing / marks a directory, and the icons come from this project's own
# set. Enabled because the alternative is what a report otherwise gets - a
# fenced block of box-drawing characters, hand-aligned, that breaks the
# moment a name changes and carries no meaning into the PDF.
[project.markdown_extensions."prodockit.tree"]
# Numbered steps a reader works through in order - a number to find your
# place by, room for a command and its explanation, and a line joining one
# step to the next. Useful anywhere a method has to be repeatable by
# somebody else, which is most of a methodology section.
[project.markdown_extensions."prodockit.steps"]
# `prodockit.citations` is deliberately *not* enabled, though it exists and
# is registered. It and prodockit.bibliography above cover the same job two
# ways: citations wants a hand-written reference paragraph carrying its own
# display text, bibliography resolves against references.bib and formats
# both the citation and the entry from a CSL style. This template has
# committed to the second - references.bib and harvard-cite-them-right.csl
# are configured above, and the starter document cites with \cite{}
# throughout. Enabling both would offer a reader two competing ways to cite
# in a document demonstrating one of them, which is worse than offering
# fewer features (prodockit-template#204).
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.blocks.caption]
# "caption" (no prefix) is kept for a plain, unnumbered caption - e.g. a
# decorative screenshot that doesn't need a "Figure N" label. The {} in each
# prefix marks where the extension's own per-page auto-number goes; the
# "Figure "/"Table " word and the chapter number in front of it are added
# by CSS (see extra.css's ".caption-prefix::before" rules) rather than
# baked into the prefix template itself, since the extension has no way to
# know this template's own cross-page chapter number - see "Captions" in
# customise.md.
types = [
  { name = "caption" },
  { name = "figure-caption", prefix = "{}.", classes = "prodockit-figure-caption" },
  { name = "table-caption", prefix = "{}.", classes = "prodockit-table-caption" },
]
[project.markdown_extensions.zensical.extensions.glightbox]


[project.markdown_extensions.zensical.extensions.macros]
# prodockit.zensical_macros is imported directly by macros.py's own
# define_env() instead of being listed here as a second `modules` entry -
# see macros.py's docstring for why (zensical/zensical#823).
module_name = "macros"
on_error_fail = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
 
