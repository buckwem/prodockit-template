.pages:
  stage: deploy
  image:
    name: python:3.14
    # GitLab.com hosted runners permit only `always`, while the Surrey runner
    # can reuse its cached copy when Docker Hub is unavailable (issue #174).
    # GitLab Runner selects the first policy here that its configuration
    # permits, so this ordered fallback works in both environments.
    pull_policy:
      - always
      - if-not-present
  # GitLab's equivalent of the concurrency group in .github/workflows/docs.yml:
  # only one instance of this job runs at a time, so two pushes started close
  # together can't both be publishing at once and leave the older build live.
  # Nothing fails when that happens, which is what makes it worth preventing
  # rather than detecting.
  resource_group: pages
  variables:
    # PDF revision dates need the complete history rather than GitLab's
    # default shallow clone.
    GIT_DEPTH: "0"
    # Keep pip downloads inside the project so GitLab's cache can preserve
    # them between jobs.
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    # Prodockit validates cached runtime metadata before use. Include the
    # committed PDF policies so either kind of rendering change refreshes it.
    key:
      prefix: "${CI_JOB_IMAGE}-pdk-pdf-0.73.0"
      files:
        - pdk-pdf.toml
        - pdf-requirements.txt
    paths:
      - .cache/pip/
      - .prodockit/cache/pdf/
  script:
    - apt-get update
    - apt-get install -y curl ca-certificates libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
    # prodockit.bibliography's citation style - not vendored (see
    # CONTRIBUTING.md's "Getting set up" and prodockit-userguide#97) - so
    # every build, including this one, fetches it fresh.
    - curl -fsSL -o harvard-cite-them-right.csl "https://www.zotero.org/styles/harvard-cite-them-right"
    # PDF maths invokes the verified MathJax 4 distribution through Node
    # directly. No npm install or browser is involved.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    # Zensical is pinned exactly here; Prodockit remains a floor.
    #
    # Zensical redraws the site, so it changes only after review. WeasyPrint
    # is PDF-only and is prepared below from pdf-requirements.txt.
    # prodockit is this project's own tooling, and a document generated from
    # this template should pick up its fixes without waiting for the
    # template to be updated and re-synced.
    #
    # See the identical line and its fuller comment in
    # .github/workflows/docs.yml. Keep both in step; managed together with
    # `prodockit pins` (see CONTRIBUTING.md). 0.73.0 is the coordinated floor.
    - pip install -r requirements.txt
    # The Surrey mirror is the canonical template's own deployment, not a
    # generated project. Record its reachable template tag in this disposable
    # checkout before rendering. Consumer projects retain the stamp written on
    # creation/template-sync and must never derive it from their own later tags.
    - if [ "$CI_PROJECT_PATH" = "mb0105/prodockit-template" ]; then pdk _record-template-release; fi
    # Prepare and verify every runtime supported on this platform. Cached runs
    # validate locally and do not repeat successful downloads.
    - pdk pdf --prepare all
    # Diagnose the prepared environment and project before rendering.
    - pdk diag
    # Was sync_repo_icon.py; now provided by prodockit itself (#128).
    - prodockit sync-repo
    # Write the separate source download before the clean website build.
    - prodockit source-bundle
    - zensical build --clean --strict
    # Consume the completed website and atomically add the finished PDF to
    # public/ without another Zensical build.
    - prodockit pdf
  pages:
    publish: public

# Runner tags must be known before a job is assigned. Defining the tag through
# `rules:variables` leaves it as the literal `$PDK_RUNNER_TAG` at scheduling
# time, so select between two small concrete jobs instead.
pages:
  extends: .pages
  tags:
    - pages
  rules:
    - if: '$CI_COMMIT_TAG && $CI_SERVER_HOST != "gitlab.com" && $CI_PROJECT_PATH == "mb0105/prodockit-template"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_SERVER_HOST != "gitlab.com"'

pages-gitlab-com:
  extends: .pages
  tags:
    - saas-linux-small-amd64
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_SERVER_HOST == "gitlab.com"'
