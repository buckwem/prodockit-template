pages:
  stage: deploy
  image: python:3.13
  tags:
    - pages
  # GitLab's equivalent of the concurrency group in .github/workflows/docs.yml:
  # only one instance of this job runs at a time, so two pushes started close
  # together can't both be publishing at once and leave the older build live.
  # Nothing fails when that happens, which is what makes it worth preventing
  # rather than detecting.
  resource_group: pages
  variables:
    # The base image's own "pandoc" apt package lags several major versions
    # behind upstream - old enough that some markdown edge cases (e.g.
    # pymdownx.caret's "^^insert^^" syntax) parse differently than on a
    # contributor's own dev machine, which is exactly what
    # test/test_zensical_basics.py's leak-detection tests check against.
    # Installing a specific upstream .deb release below instead of
    # "apt-get install pandoc" keeps CI and local dev on the same version,
    # rather than silently drifting whenever the base image's own package
    # updates. Keep in sync with .github/workflows/docs.yml's PANDOC_VERSION.
    PANDOC_VERSION: "3.10.1"
    # mermaid-cli drives Chrome through Puppeteer to rasterise diagrams.
    # Point it at the apt-installed Chrome further down rather than letting
    # Puppeteer download its own, and skip that download entirely.
    #
    # PUPPETEER_SKIP_DOWNLOAD, not the older
    # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
    # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which honours only the
    # new name. Under the old one the skip silently does nothing and a full
    # Chrome build is downloaded on every run before being discarded in
    # favour of PUPPETEER_EXECUTABLE_PATH anyway.
    #
    # Set here rather than as `export` lines in `script:` so they apply to
    # the whole job regardless of step order - as exports they sat a few
    # lines above `npm ci`, and reordering the script would have quietly
    # reintroduced the problem.
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
  script:
    - apt-get update
    - apt-get install -y curl gnupg ca-certificates
    - curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
    - apt-get install -y /tmp/pandoc.deb
    # prodockit.bibliography's citation style - not vendored (see
    # CONTRIBUTING.md's "Getting set up" and prodockit-userguide#97) - so
    # every build, including this one, fetches it fresh.
    - curl -fsSL -o harvard-cite-them-right.csl "https://www.zotero.org/styles/harvard-cite-them-right"
    # fonts-inter/fonts-jetbrains-mono: this template's default fonts (see
    # "Fonts" in the User Guide's customise.md) - the website loads them from Google Fonts at
    # view time, but WeasyPrint has no such fallback for the PDF; it needs
    # the font files actually installed to embed them, and silently
    # substitutes a generic system font instead of erroring if they're
    # missing (see test_customisation.py's font-embedding check).
    - apt-get install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra fonts-inter fonts-jetbrains-mono
    # Node + Chrome are only needed so `prodockit pdf` can pre-render
    # ```mermaid fenced code blocks to static images via mermaid-cli/Puppeteer,
    # and TeX math ($...$/$$...$$) to static images via mathjax-full (pure
    # Node, no browser needed for that one) - WeasyPrint has no JS engine to
    # run Mermaid.js/MathJax client-side like the live Zensical site does.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update
    - apt-get install -y google-chrome-stable
    - npm ci --prefix tools/mermaid
    - npm ci --prefix tools/mathjax
    # zensical and weasyprint pinned exactly here; prodockit to a floor.
    #
    # The two that decide *rendering* stay exact - a new weasyprint
    # repaginates and a new zensical redraws, and the site and PDF are
    # artifacts that should change when somebody decides they should.
    # prodockit is this project's own tooling, and a document generated from
    # this template should pick up its fixes without waiting for the
    # template to be updated and re-synced.
    #
    # See the identical line and its fuller comment in
    # .github/workflows/docs.yml. Keep both in step; managed together with
    # `prodockit pins` (see CONTRIBUTING.md). 0.42.1 is the coordinated patch
    # floor for forward cross-page references and table cell shading; 0.26.2
    # was the previous floor, for `prodockit init-mathjax` below (issue #167).
    - pip install -r requirements.txt -r testrequirements.txt "zensical==0.0.55" "weasyprint==69.0" "prodockit>=0.42.1"
    # MathJax for the website, from the npm install above - see the
    # identical step's comment in .github/workflows/docs.yml. This job
    # never had this step at all until now (issue #167 found it missing
    # while replacing docs.yml's own version): zensical.toml's
    # extra_javascript unconditionally references
    # javascripts/mathjax.js/vendor/mathjax/tex-svg-full.js, so every page
    # built here had a dangling script reference and showed raw TeX.
    - prodockit init-mathjax
    # Was sync_repo_icon.py; now provided by prodockit itself (#128).
    - prodockit sync-repo
    - prodockit pdf
    # Writes docs/source_bundle.pdf - inside docs_dir, so zensical build
    # copies it into public/ the same way it already does for
    # docs/site_documentation.pdf, with no separate copy step needed
    # (prodockit-extensions#212, prodockit-template#160). Run before
    # zensical build, not after, or the file wouldn't exist yet when that
    # step decides what to copy.
    - prodockit source-bundle
    - zensical build --clean
    # Reported, not enforced - for now, and deliberately for a generated
    # project as much as for this one.
    #
    # These checks assert on *this* document: that section4.md's Mermaid
    # diagram rendered, that the word count matches this prose. A report
    # generated from this template replaces that content, so the assertions
    # cannot hold there - and they failed a real assignment's pipeline for
    # having no Mermaid diagram, which is not a fault in the report
    # (prodockit-template#194).
    #
    # A generated project inherits this file, so making it non-blocking here
    # is what stops that happening again while #194 decides which checks a
    # project should carry at all. The cost is that this template loses its
    # own gate meanwhile: a regression shows in the log rather than stopping
    # the build. Run the same command locally when investigating a failure.
    - python test/run_tests.py || true
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
