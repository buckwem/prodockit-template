pages:
  stage: deploy
  image: python:latest
  tags:
    - pages
  # GitLab's equivalent of the concurrency group in .github/workflows/docs.yml:
  # only one instance of this job runs at a time, so two pipelines started
  # close together (a release published shortly after its version-bump push,
  # or two pushes in quick succession) can't both be publishing at once and
  # leave the older build live. Nothing fails when that happens, which is
  # what makes it worth preventing rather than detecting.
  resource_group: pages
  variables:
    # The base image's own "pandoc" apt package lags several major versions
    # behind upstream - old enough that some markdown edge cases (e.g.
    # pymdownx.caret's "^^insert^^" syntax) parse differently than on a
    # contributor's own dev machine, which is exactly what
    # test/test_zensical_basics.py's leak-detection tests check against.
    # Installing a specific upstream .deb release below instead of
    # "apt-get install pandoc" keeps CI and local dev on the same version,
    # rather than silently drifting whenever the base image's own package
    # updates. Keep in sync with .github/workflows/docs.yml's PANDOC_VERSION.
    PANDOC_VERSION: "3.10"
    # mermaid-cli drives Chrome through Puppeteer to rasterise diagrams.
    # Point it at the apt-installed Chrome further down rather than letting
    # Puppeteer download its own, and skip that download entirely.
    #
    # PUPPETEER_SKIP_DOWNLOAD, not the older
    # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
    # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which honours only the
    # new name. Under the old one the skip silently does nothing and a full
    # Chrome build is downloaded on every run before being discarded in
    # favour of PUPPETEER_EXECUTABLE_PATH anyway.
    #
    # Set here rather than as `export` lines in `script:` so they apply to
    # the whole job regardless of step order - as exports they sat a few
    # lines above `npm ci`, and reordering the script would have quietly
    # reintroduced the problem.
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
  script:
    - apt-get update
    - apt-get install -y curl gnupg ca-certificates
    - curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
    - apt-get install -y /tmp/pandoc.deb
    # fonts-inter/fonts-jetbrains-mono: this template's default fonts (see
    # "Fonts" in the User Guide's customise.md) - the website loads them from Google Fonts at
    # view time, but WeasyPrint has no such fallback for the PDF; it needs
    # the font files actually installed to embed them, and silently
    # substitutes a generic system font instead of erroring if they're
    # missing (see test_customisation.py's font-embedding check).
    - apt-get install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra fonts-inter fonts-jetbrains-mono
    # Node + Chrome are only needed so `prodockit pdf` can pre-render
    # ```mermaid fenced code blocks to static images via mermaid-cli/Puppeteer,
    # and TeX math ($...$/$$...$$) to static images via mathjax-full (pure
    # Node, no browser needed for that one) - WeasyPrint has no JS engine to
    # run Mermaid.js/MathJax client-side like the live Zensical site does.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update
    - apt-get install -y google-chrome-stable
    - npm ci --prefix tools/mermaid
    - npm ci --prefix tools/mathjax
    # zensical/weasyprint/prodockit pinned exactly here, on top of
    # requirements.txt's own floors - see the identical line and its comment
    # in .github/workflows/docs.yml. Keep both in step; managed together
    # with `prodockit pins` (see CONTRIBUTING.md).
    - pip install -r requirements.txt -r testrequirements.txt "zensical==0.0.53" "weasyprint==69.0" "prodockit==0.18.0"
    # Was sync_repo_icon.py; now provided by prodockit itself (#128).
    - prodockit sync-repo
    - prodockit pdf
    - zensical build --clean
    # source_bundle.pdf (from pdf_source_bundle in zensical.toml) is written
    # to the project root by prodockit.pdf.config, not docs_dir - it bundles
    # the whole repo's own source, not just docs_dir's content, so it isn't
    # one of the files `zensical build` copies into public/ on its own.
    # Copied in explicitly, before the test suite runs, since test_links.py
    # checks that the cover page's "Source" button actually resolves inside
    # public/.
    - cp source_bundle.pdf public/source_bundle.pdf
    - python test/run_tests.py
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Also rebuild for a tag pipeline, which is what publishing a release
    # produces. The cover page's "Release: ..." line is resolved by
    # `prodockit pdf` from the host's releases API at build time, so without
    # this the published PDF keeps showing the *previous* release until some
    # unrelated commit happens to trigger a pipeline.
    #
    # Needed because the rule above cannot match a tag pipeline:
    # $CI_COMMIT_BRANCH is empty there, so the job would not run at all.
    # This is the counterpart of `release: [published]` in
    # .github/workflows/docs.yml. It fires for any tag rather than only for
    # tags with a GitLab release attached, which is the closer match to how
    # this project actually tags - and a redundant rebuild is harmless.
    - if: '$CI_COMMIT_TAG'

# The pages job above pins zensical/weasyprint/prodockit exactly, so the
# published site and PDF only change when someone decides they should. The
# cost of pinning is going quietly stale: nothing says a newer release
# exists, or what it would do to the output.
#
# This closes that, on demand rather than on a schedule (see
# .github/workflows/drift.yml's own comment, and prodockit-extensions#145
# for the version this is adapted from, which does run weekly there).
# Builds the docs twice in one job - once with the pinned versions, once
# with the newest - diffs byte for byte, and opens an issue saying what
# moved. Reports rather than fails: `allow_failure: true` keeps the
# pipeline green regardless of what this job finds, since its purpose is
# the issue it opens, not its own exit status.
#
# Requires a project access token with the `api` scope, exposed as the
# CI/CD variable DRIFT_TOKEN (Settings -> CI/CD -> Variables) - not
# something this repo's own files can set up; add it once by hand before
# running this job.
drift:
  stage: deploy
  image: python:latest
  # Only created when someone starts a pipeline manually from the GitLab
  # UI ("Run pipeline") - never on an ordinary push or tag pipeline, and
  # with no pipeline schedule involved at all.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  allow_failure: true
  variables:
    PANDOC_VERSION: "3.10"
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
  script:
    - apt-get update
    - apt-get install -y curl gnupg ca-certificates jq
    - curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
    - apt-get install -y /tmp/pandoc.deb
    - apt-get install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra fonts-inter fonts-jetbrains-mono
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update
    - apt-get install -y google-chrome-stable
    - npm ci --prefix tools/mermaid
    - npm ci --prefix tools/mathjax
    # Keep in step with the pages job's own install line above.
    - pip install -r requirements.txt -r testrequirements.txt "zensical==0.0.53" "weasyprint==69.0" "prodockit==0.18.0"
    - prodockit pdf
    - zensical build --clean
    - cp source_bundle.pdf public/source_bundle.pdf
    - mkdir -p /tmp/pinned && cp -R public /tmp/pinned/public && cp docs/site_documentation.pdf /tmp/pinned/doc.pdf
    - PINNED_ZENSICAL=$(pip show zensical | awk '/^Version:/{print $2}')
    - PINNED_WEASYPRINT=$(pip show weasyprint | awk '/^Version:/{print $2}')
    - PINNED_PRODOCKIT=$(pip show prodockit | awk '/^Version:/{print $2}')
    - pip install -qU zensical weasyprint prodockit
    - rm -rf public source_bundle.pdf docs/site_documentation.pdf
    - prodockit pdf
    - zensical build --clean
    - cp source_bundle.pdf public/source_bundle.pdf
    - LATEST_ZENSICAL=$(pip show zensical | awk '/^Version:/{print $2}')
    - LATEST_WEASYPRINT=$(pip show weasyprint | awk '/^Version:/{print $2}')
    - LATEST_PRODOCKIT=$(pip show prodockit | awk '/^Version:/{print $2}')
    # Run against the *newest* build, so a release that breaks the real
    # rendering checks is caught here rather than on the day someone
    # raises the pin. `|| true` - never fails the job, the result is
    # reported below instead.
    - TESTS_OUTCOME=$(python test/run_tests.py > /tmp/test-output.txt 2>&1 && echo "passed" || echo "failed") || true
    - |
      if [ "$PINNED_ZENSICAL" = "$LATEST_ZENSICAL" ] && [ "$PINNED_WEASYPRINT" = "$LATEST_WEASYPRINT" ] && [ "$PINNED_PRODOCKIT" = "$LATEST_PRODOCKIT" ]; then
        echo "Pins are current: zensical $PINNED_ZENSICAL, weasyprint $PINNED_WEASYPRINT, prodockit $PINNED_PRODOCKIT. Nothing to report."
        exit 0
      fi
      cmp -s /tmp/pinned/doc.pdf docs/site_documentation.pdf && PDF_STATE=identical || PDF_STATE="**differs**"
      SITE_CHANGED=$(diff -rq /tmp/pinned/public public 2>/dev/null | wc -l | tr -d ' ')
      # One open issue at a time - a run that opens a fresh issue every
      # time someone triggers it is worse than no automation at all.
      EXISTING=$(curl -sf --header "PRIVATE-TOKEN: $DRIFT_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues?state=opened&search=Dependency+drift" \
        | jq -r '.[0].iid // empty')
      BODY="A newer zensical, weasyprint or prodockit is available than the docs build pins.\n\n| | Pinned | Newest |\n|---|---|---|\n| zensical | $PINNED_ZENSICAL | $LATEST_ZENSICAL |\n| weasyprint | $PINNED_WEASYPRINT | $LATEST_WEASYPRINT |\n| prodockit | $PINNED_PRODOCKIT | $LATEST_PRODOCKIT |\n\nBuilt the docs with each, in the same job, and compared byte for byte:\n\n- PDF: $PDF_STATE\n- Website: $SITE_CHANGED files differ\n- Built-output checks against the newest build: $TESTS_OUTCOME\n\nTo take the upgrade: run \`prodockit pins\` (see CONTRIBUTING.md) to move every declaration together, then rebuild and diff before committing.\n\n_Opened by the drift job (run on demand from the GitLab UI). Updated in place rather than reopened while this stays open._"
      if [ -n "$EXISTING" ]; then
        curl -sf --request POST --header "PRIVATE-TOKEN: $DRIFT_TOKEN" \
          --data-urlencode "body=$BODY" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$EXISTING/notes" > /dev/null
        echo "Updated existing issue !$EXISTING"
      else
        curl -sf --request POST --header "PRIVATE-TOKEN: $DRIFT_TOKEN" \
          --data-urlencode "title=Dependency drift: newer zensical/weasyprint/prodockit than the docs build pins" \
          --data-urlencode "description=$BODY" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues" > /dev/null
        echo "Opened a new issue"
      fi