name: Documentation
on:
  push:
    branches:
      - master
      - main
  # Deliberately *no* `release: [published]` trigger, though the cover
  # page's PDF-only `{RELEASE}` marker (docs/index.md), resolved by
  # `prodockit pdf` from the host's releases API at build time, does need
  # a rebuild once the release exists. That rebuild now comes from
  # release-redeploy.yml, which re-triggers this workflow against `main`.
  #
  # Deploying straight from the release event is what the old trigger did,
  # and it never worked: a release event runs against refs/tags/<tag>, so
  # the Pages deployment it created carried a tag ref, and Pages -
  # configured with `source: {branch: main}` - accepted it, reported
  # `success`, and carried on serving the previous build. Silently: this
  # repo shows 0 tag-ref Pages deployments out of 95, and no evidence the
  # trigger ever actually fired a release-triggered docs.yml run at all
  # (issue #143) - prodockit-extensions hit the live version of this on
  # releases 0.17.0-0.17.2 (prodockit-extensions#147, fixed in #148, which
  # this restructure is adapted from).
  #
  # The `tag: *.*.*` entry in the github-pages environment's deployment
  # branch policies (added for the old trigger) is now redundant, since
  # nothing here deploys from a tag - harmless to leave, harmless to
  # remove.
  #
  # Note this is not the same mechanism as prodockit-userguide's, which uses
  # prodockit.zensical_macros' `{{ release }}` (`git describe --tags`) and
  # therefore needs `fetch-depth: 0` to see any tags at all. Nothing here
  # reads git tags, which is why the checkout below deliberately keeps the
  # default shallow clone.
  #
  # .gitlab-ci.yml carries the equivalent as an `if: $CI_COMMIT_TAG` rule -
  # untouched here, since GitLab's own tag-ref Pages deployments are not
  # known to have this problem.
  workflow_dispatch:

# release-redeploy.yml re-triggering this workflow against `main` can still
# start close behind an ordinary push - merging a version-bump commit right
# before publishing its release - so this is still worth keeping even
# though the specific push-vs-release-event race this was originally
# written for no longer applies (see prodockit-extensions#134 for that
# original race, and prodockit-extensions#148 for this comment's update).
#
# `cancel-in-progress: false` rather than true: a queued deploy should wait
# and then supersede, not be discarded. Same pairing as GitHub's own Pages
# starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Consumed by the verify job below.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      index_sha: ${{ steps.fingerprint.outputs.index_sha }}
    env:
      # Only needed so `prodockit pdf` can pre-render ```mermaid fenced code
      # blocks to static images via mermaid-cli/Puppeteer, and TeX math
      # ($...$/$$...$$) to static images via mathjax-full (pure Node, no
      # browser needed for that one) - WeasyPrint has no JS engine to run
      # Mermaid.js/MathJax client-side like the live Zensical site does. Using
      # the apt-installed Google Chrome below instead of Puppeteer's own
      # bundled download avoids guessing at headless-Chrome shared-library
      # package names.
      #
      # PUPPETEER_SKIP_DOWNLOAD, not the older
      # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
      # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which only honours
      # the new name. Under the old name the skip silently does nothing and
      # a full Chrome build is downloaded on every run before falling back
      # to the apt one below.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      # Ubuntu's own "pandoc" apt package lags several major versions behind
      # upstream (3.1.3 on 24.04 at time of writing) - old enough that some
      # markdown edge cases (e.g. pymdownx.caret's "^^insert^^" syntax) parse
      # differently than on a contributor's own dev machine, which is exactly
      # what test/test_zensical_basics.py's leak-detection tests check
      # against. Installing a specific upstream .deb release below instead of
      # "apt install pandoc" keeps CI and local dev on the same version,
      # rather than silently drifting whenever Ubuntu's own package updates.
      PANDOC_VERSION: "3.10"
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt update
      - run: sudo apt install -y curl gnupg ca-certificates
      - run: |
          curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt install -y /tmp/pandoc.deb
      # fonts-inter/fonts-jetbrains-mono: this template's default fonts (see
      # "Fonts" in the User Guide's customise.md) - the website loads them from Google Fonts
      # at view time, but WeasyPrint has no such fallback for the PDF; it
      # needs the font files actually installed to embed them, and silently
      # substitutes a generic system font instead of erroring if they're
      # missing (see test_customisation.py's font-embedding check).
      - run: sudo apt install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra fonts-inter fonts-jetbrains-mono
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      - run: sudo apt update
      - run: sudo apt install -y google-chrome-stable
      - run: npm ci --prefix tools/mermaid
      - run: npm ci --prefix tools/mathjax
      # zensical/weasyprint pinned exactly here, on top of requirements.txt's
      # own floors: this is the project's own published build, an artifact
      # that should change when someone decides it should, not whenever
      # either package next releases. weasyprint matters most - it decides
      # pagination, and those page numbers are resolved into the table of
      # contents. Managed together with `prodockit pins` (see
      # CONTRIBUTING.md) rather than by hand - keep this in step with
      # requirements.txt's own floors, and with the identical line in
      # .gitlab-ci.yml.
      - run: pip install -r requirements.txt -r testrequirements.txt "zensical==0.0.52" "weasyprint==69.0"
      # Keeps repo_url/repo_name/edit_uri/brand icon and the README badge
      # row matching whichever remote this checkout is published from.
      # Was sync_repo_icon.py; now provided by prodockit itself, which
      # also detects the default branch rather than assuming "main" -
      # the case that matters when this template is forked (#128).
      - run: prodockit sync-repo
      - run: prodockit pdf
      - run: zensical build --clean
      # source_bundle.pdf (from pdf_source_bundle in zensical.toml) is
      # written to the project root by prodockit.pdf.config, not docs_dir -
      # it bundles the whole repo's own source, not just docs_dir's content,
      # so it isn't one of the files `zensical build` copies into public/ on
      # its own. Copied in explicitly, before the test suite runs, since
      # test_links.py checks that the cover page's "Source" button actually
      # resolves inside public/.
      - run: cp source_bundle.pdf public/source_bundle.pdf
      - run: python test/run_tests.py
      # Fingerprint what we are about to publish, so the verify job below can
      # tell whether the live site is actually serving *this* build. Taken
      # from the same directory upload-pages-artifact packs, immediately
      # before it packs it.
      - id: fingerprint
        run: echo "index_sha=$(sha256sum public/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment

  # A successful deploy does not mean the site serves it. #143 hit exactly
  # this: releases deployed fine from a tag ref and Pages kept serving the
  # previous build - the deployment reported `success`, and the origin
  # carried on returning the old bytes until someone noticed and re-ran this
  # workflow by hand. Nothing in the run itself was wrong, so nothing went
  # red.
  #
  # #143/#144's fix (redeploying against `main` instead of a tag ref)
  # removes that specific cause, but not the general risk: a successful
  # deploy job is still not proof of delivery. This closes that gap directly
  # - compare the live page against the fingerprint of the build just
  # uploaded, and fail the run if they never converge. Separate job rather
  # than another step, so the deploy itself is never gated on delivery - the
  # artifact is published either way, and this only decides whether the run
  # reports success. Ported from prodockit-extensions#142, already running
  # the same way in prodockit-userguide (issue #145).
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Pages serves `cache-control: max-age=600`, so up to ~10 minutes of
      # staleness is normal and expected rather than a fault. 15 minutes of
      # polling clears that window with room to spare; past it, every
      # occurrence so far has needed a manual redeploy. A `?cb=` query
      # buster would not help - the CDN normalises query strings - so this
      # waits the TTL out rather than trying to defeat it.
      - name: Verify the live site serves this build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          WANT: ${{ needs.deploy.outputs.index_sha }}
        run: |
          set -u
          for attempt in $(seq 1 30); do
            # Download to a file rather than piping or capturing. Piping into
            # sha256sum reports the *pipe's* exit status, so a failed fetch
            # silently hashes empty input instead of being noticed; capturing
            # the body in $(...) strips its trailing newline, so the hash
            # would never match the file on disk.
            if curl -fsSL --max-time 30 -o live-index.html "$PAGE_URL"; then
              got=$(sha256sum live-index.html | cut -d' ' -f1)
            else
              got="fetch-failed"
            fi
            if [ "$got" = "$WANT" ]; then
              echo "Live after ~$(( (attempt - 1) * 30 ))s: $PAGE_URL is serving this build."
              exit 0
            fi
            echo "attempt $attempt/30: live index.html is $got, want $WANT"
            sleep 30
          done
          # One line: a ::error:: annotation is terminated by the newline, and
          # a backslash continuation would fold this block's own indentation
          # into the message as runs of spaces.
          echo "::error::$PAGE_URL is not serving this build after 15 minutes. The deploy succeeded but delivery did not. Re-run with: gh workflow run docs.yml --ref main"
          echo "Live page headers for diagnosis (last-modified predating this run means the old build is still being served):"
          curl -sI "$PAGE_URL" | grep -iE 'last-modified|etag|age' || true
          exit 1
