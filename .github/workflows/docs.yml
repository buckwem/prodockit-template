name: Documentation
on:
  push:
    branches:
      - master
      - main
  # The template PDF intentionally has no release marker: its consumers'
  # documents must not expose the template repository's package version.
  # A release therefore does not alter generated documentation and does not
  # need its own deployment trigger.
  workflow_dispatch:

# `cancel-in-progress: false` rather than true: a queued deploy should wait
# and then supersede, not be discarded. Same pairing as GitHub's own Pages
# starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    # Builds the site and the PDFs: about three and a half minutes,
    # eleven and a half at its slowest over 26 runs. The margin is for
    # a slow build, not for a stall - a job that hangs must fail while
    # somebody is still watching (issue #189).
    timeout-minutes: 30
    # Consumed by the verify job below.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      index_sha: ${{ steps.fingerprint.outputs.index_sha }}
    env:
      # Only needed so `prodockit pdf` can pre-render ```mermaid fenced code
      # blocks to static images via mermaid-cli/Puppeteer, and TeX math
      # ($...$/$$...$$) to static images via mathjax-full (pure Node, no
      # browser needed for that one) - WeasyPrint has no JS engine to run
      # Mermaid.js/MathJax client-side like the live Zensical site does. Using
      # the apt-installed Google Chrome below instead of Puppeteer's own
      # bundled download avoids guessing at headless-Chrome shared-library
      # package names.
      #
      # PUPPETEER_SKIP_DOWNLOAD, not the older
      # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
      # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which only honours
      # the new name. Under the old name the skip silently does nothing and
      # a full Chrome build is downloaded on every run before falling back
      # to the apt one below.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      # Ubuntu's own "pandoc" apt package lags several major versions behind
      # upstream (3.1.3 on 24.04 at time of writing) - old enough that some
      # markdown edge cases (e.g. pymdownx.caret's "^^insert^^" syntax) parse
      # differently than on a contributor's own dev machine, which is exactly
      # what test/test_zensical_basics.py's leak-detection tests check
      # against. Installing a specific upstream .deb release below instead of
      # "apt install pandoc" keeps CI and local dev on the same version,
      # rather than silently drifting whenever Ubuntu's own package updates.
      PANDOC_VERSION: "3.10.1"
    steps:
      # `enablement: true` creates the Pages site if it does not exist,
      # instead of failing with "Get Pages site failed" and leaving the
      # reader to find Settings > Pages themselves. That manual step is
      # easy to rush past while setting a project up, and the error names
      # the site rather than the setting that is missing, so nothing
      # points at the fix (prodockit-extensions#333).
      #
      # `permissions: pages: write` above is what allows it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # One source of truth for the version a build uses:
          # pyenv and uv read this file too, so a reader's shell
          # picks the same interpreter without being told
          # (prodockit-extensions#363).
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The image's mirrorlist puts `azure.archive.ubuntu.com` first. When
      # that host is down - it was, repeatedly, on 2026-08-18, holding
      # runs in the other two repositories for 35 and 11 minutes - apt
      # spends minutes on it before reaching the `archive.ubuntu.com`
      # fallback, which answers in milliseconds throughout. Neither a
      # shorter connect timeout nor fewer retries reached it in reasonable
      # time, so the dead host is taken out of the list instead
      # (prodockit-extensions#478, issue #189).
      #
      # Reported rather than assumed: if the image stops shipping a
      # mirrorlist, or stops using Azure, the run says so and carries on
      # unchanged - a substitution that quietly matched nothing would be
      # worse than either.
      - name: Point apt at a mirror that answers
        timeout-minutes: 2
        run: |
          list=/etc/apt/apt-mirrors.txt
          if [ ! -f "$list" ]; then
            echo "::notice::no $list in this image - apt left as it is"
          elif ! grep -q 'azure.archive.ubuntu.com' "$list"; then
            echo "::notice::$list no longer names Azure - apt left as it is"
          else
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$list"
            echo "mirrorlist now:"; cat "$list"
          fi
      - run: sudo apt update
        timeout-minutes: 8
      - run: sudo apt install -y curl gnupg ca-certificates
      - run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt install -y /tmp/pandoc.deb
      # prodockit.bibliography's citation style - not vendored (see
      # CONTRIBUTING.md's "Getting set up" and prodockit-userguide#97) - so
      # every build, including this one, fetches it fresh.
      - run: curl -fsSL -o harvard-cite-them-right.csl "https://www.zotero.org/styles/harvard-cite-them-right"
      # fonts-inter/fonts-jetbrains-mono: this template's default fonts (see
      # "Fonts" in the User Guide's customise.md) - the website loads them from Google Fonts
      # at view time, but WeasyPrint has no such fallback for the PDF; it
      # needs the font files actually installed to embed them, and silently
      # substitutes a generic system font instead of erroring if they're
      # missing (see test_customisation.py's font-embedding check).
      - run: sudo apt install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra fonts-inter fonts-jetbrains-mono
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      - run: sudo apt update
        timeout-minutes: 8
      - run: sudo apt install -y google-chrome-stable
      - run: npm ci --prefix tools/mermaid
      - run: npm ci --prefix tools/mathjax
        # zensical and weasyprint pinned exactly here; prodockit to a floor.
        #
        # The two that decide *rendering* stay exact, because the site and the
        # PDF are artifacts and should change when somebody decides they should:
        # a new weasyprint repaginates, and those page numbers are resolved into
        # the table of contents and the index; a new zensical redraws the site.
        #
        # prodockit is different. It is this project's own tooling rather than a
        # third-party renderer, and a document generated from this template
        # should pick up its fixes without waiting for the template to be
        # updated and re-synced - a student writing over a term would otherwise
        # sit on whatever release the template happened to name on the day they
        # generated it. The floor guarantees the features this template uses
        # exist; anything newer is welcome.
        #
        # prodockit itself is intentionally allowed to resolve to any
        # compatible release in every build. `prodockit template-sync` warns
        # an author when the activated project environment is behind.
        #
        # On top of requirements.txt's own floors. Managed together with
        # `prodockit pins` (see CONTRIBUTING.md) rather than by hand - keep this
        # in step with requirements.txt, and with the identical line in
        # .gitlab-ci.yml. 0.48.1 is the coordinated release floor for the
        # current renderer, authoring components and shared stylesheets.
      - run: pip install -r requirements.txt -r testrequirements.txt "zensical==0.0.57" "weasyprint==69.0" "prodockit>=0.48.1"
      # Offline and non-writing: keeps every declaration consistent and also
      # checks manifest-managed files against this installed Prodockit
      # release. A failure names the drift and prints its recovery command.
      - run: prodockit pins --check --offline
      # MathJax for the *website*, from the npm install above. Neither file
      # is committed - the bundle is third-party code, and both are
      # written by `prodockit bootstrap` on a developer's machine - so CI
      # has to install them the same way, exactly as it already fetches
      # the CSL style above. Without this the site builds with a dangling
      # script reference and shows raw TeX where an equation should be.
      # Was a heredoc duplicating bootstrap's own stage 18 (prodockit-
      # extensions#276) - two copies of a config whose whole failure mode
      # is being subtly wrong, replaced by the one implementation both now
      # call (prodockit-extensions#298, issue #167). Needs `prodockit` on
      # PATH, so this runs after the pip install above, not with the other
      # npm ci step it pairs with.
      - run: prodockit init-mathjax
      # Keeps repo_url/repo_name/edit_uri/brand icon and the README badge
      # row matching whichever remote this checkout is published from.
      # Was sync_repo_icon.py; now provided by prodockit itself, which
      # also detects the default branch rather than assuming "main" -
      # the case that matters when this template is forked (#128).
      - run: prodockit sync-repo
      - run: prodockit pdf
      # Writes docs/source_bundle.pdf - inside docs_dir, so the next step
      # copies it into public/ the same way it already does for
      # docs/site_documentation.pdf, with no separate copy step needed
      # (prodockit-extensions#212, prodockit-template#160). Run before
      # `zensical build`, not after, or the file wouldn't exist yet when
      # that step decides what to copy.
      - run: prodockit source-bundle
      # Build and check the reusable template before applying anything that
      # belongs only to template.prodockit.org. This is the output inherited
      # by forks, clones and GitLab projects.
      - name: Build the reusable template website
        run: zensical build --clean
      # Reported, not enforced - see the fuller note in .gitlab-ci.yml.
      # These checks assert on this document's own content, which a generated
      # project replaces, and a generated project inherits this file
      # (prodockit-template#194).
      - name: Built-output checks (reported, not enforced)
        continue-on-error: true
        run: python test/run_tests.py
      # This repository is both the reusable starter and a published example.
      # Keep the committed site_url generic and its configuration analytics-
      # free. Only the upstream GitHub build receives the custom domain and
      # consent-gated Analytics, through this temporary configuration. Forks,
      # clones and GitLab never receive the tag. Committing docs/CNAME would
      # likewise make every new project claim the upstream domain, so that
      # marker remains build-only.
      - name: Prepare the canonical website analytics
        if: github.repository == 'buckwem/prodockit-template'
        env:
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
        run: |
          if [ -z "$GOOGLE_ANALYTICS_ID" ]; then
            echo "::error::The canonical template site needs the GOOGLE_ANALYTICS_ID repository secret."
            exit 1
          fi
          python tools/canonical_site_config.py zensical.toml .zensical-upstream.toml "$GOOGLE_ANALYTICS_ID" "https://template.prodockit.org/"
      - name: Build the canonical template website
        if: github.repository == 'buckwem/prodockit-template'
        run: zensical build --config-file .zensical-upstream.toml --clean
      - name: Add the upstream custom-domain marker
        if: github.repository == 'buckwem/prodockit-template'
        run: printf 'template.prodockit.org\n' > public/CNAME
      # Fingerprint what we are about to publish, so the verify job below can
      # tell whether the live site is actually serving *this* build. Taken
      # from the same directory upload-pages-artifact packs, immediately
      # before it packs it.
      - id: fingerprint
        run: echo "index_sha=$(sha256sum public/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment

  # A successful deploy does not mean the site serves it. #143 hit exactly
  # this: releases deployed fine from a tag ref and Pages kept serving the
  # previous build - the deployment reported `success`, and the origin
  # carried on returning the old bytes until someone noticed and re-ran this
  # workflow by hand. Nothing in the run itself was wrong, so nothing went
  # red.
  #
  # #143/#144's fix (redeploying against `main` instead of a tag ref)
  # removes that specific cause, but not the general risk: a successful
  # deploy job is still not proof of delivery. This closes that gap directly
  # - compare the live page against the fingerprint of the build just
  # uploaded, and fail the run if they never converge. Separate job rather
  # than another step, so the deploy itself is never gated on delivery - the
  # artifact is published either way, and this only decides whether the run
  # reports success. Ported from prodockit-extensions#142, already running
  # the same way in prodockit-userguide (issue #145).
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    # Above the polling window below, so a limit cannot cut short a
    # wait that is working.
    timeout-minutes: 25
    steps:
      # Pages serves `cache-control: max-age=600`, so up to ~10 minutes of
      # staleness is normal and expected rather than a fault. 15 minutes of
      # polling clears that window with room to spare; past it, every
      # occurrence so far has needed a manual redeploy. A `?cb=` query
      # buster would not help - the CDN normalises query strings - so this
      # waits the TTL out rather than trying to defeat it.
      - name: Verify the live site serves this build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          WANT: ${{ needs.deploy.outputs.index_sha }}
        run: |
          set -u
          for attempt in $(seq 1 30); do
            # Download to a file rather than piping or capturing. Piping into
            # sha256sum reports the *pipe's* exit status, so a failed fetch
            # silently hashes empty input instead of being noticed; capturing
            # the body in $(...) strips its trailing newline, so the hash
            # would never match the file on disk.
            if curl -fsSL --max-time 30 -o live-index.html "$PAGE_URL"; then
              got=$(sha256sum live-index.html | cut -d' ' -f1)
            else
              got="fetch-failed"
            fi
            if [ "$got" = "$WANT" ]; then
              echo "Live after ~$(( (attempt - 1) * 30 ))s: $PAGE_URL is serving this build."
              exit 0
            fi
            echo "attempt $attempt/30: live index.html is $got, want $WANT"
            sleep 30
          done
          # One line: a ::error:: annotation is terminated by the newline, and
          # a backslash continuation would fold this block's own indentation
          # into the message as runs of spaces.
          echo "::error::$PAGE_URL is not serving this build after 15 minutes. The deploy succeeded but delivery did not. Re-run with: gh workflow run docs.yml --ref main"
          echo "Live page headers for diagnosis (last-modified predating this run means the old build is still being served):"
          curl -sI "$PAGE_URL" | grep -iE 'last-modified|etag|age' || true
          exit 1
