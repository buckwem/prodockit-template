name: Redeploy canonical documentation after release

on:
  release:
    types:
      - published
  workflow_dispatch:

# This workflow is inherited by generated projects, but their own release tags
# must not change applied_release. Only the canonical template needs a rebuild
# after tagging so its disposable docs checkout can record the new template
# release before rendering.
permissions:
  actions: write

jobs:
  redeploy:
    if: github.repository == 'buckwem/prodockit-template'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch documentation workflow against main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main
