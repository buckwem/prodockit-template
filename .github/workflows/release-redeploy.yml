# The cover page's PDF-only `{RELEASE}` marker (docs/index.md) can only
# ever show a release that already exists when `prodockit pdf` runs, and a
# release is normally published *after* the version-bump commit that
# triggers the ordinary docs.yml deploy - so something has to rebuild the
# docs once the release exists.
#
# docs.yml used to do that itself, with its own `release: [published]`
# trigger. That never worked, and failed silently: a release event runs
# against `refs/tags/<tag>`, so the Pages deployment it created carried a
# tag ref, and GitHub Pages - configured with `source: {branch: main}` -
# accepted the deployment, reported `success`, and went on serving the
# previous build (issue #143, adapted from prodockit-extensions#147/#148,
# which hit the live version of this on releases 0.17.0-0.17.2, nine
# deployments and no counterexamples).
#
# So this workflow does not build or deploy anything itself. It
# re-triggers docs.yml *against main*, which is the one ref known to
# deploy correctly - exactly what a manual `gh workflow run docs.yml --ref
# main` would do by hand.
#
# Consequences worth knowing:
#
# - The `tag: *.*.*` entry in the github-pages environment's deployment
#   branch policies (added for the old trigger) is now redundant. Nothing
#   here deploys from a tag. Harmless to leave, harmless to remove.
# - This costs one extra docs build per release - the price of the cover
#   line being right.
name: Redeploy docs after a release

on:
  release:
    types: [published]
  # So the dispatch mechanism itself can be exercised without cutting a
  # release - the failure mode this replaces was one nobody could test
  # from a PR.
  workflow_dispatch:

# `actions: write` is what lets GITHUB_TOKEN start another workflow run.
# Nothing else is needed: this job checks nothing out and builds nothing.
permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    # Seconds in every run measured.
    timeout-minutes: 10
    steps:
      - name: Rebuild and deploy the docs from main
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so `gh` cannot infer the repository from a git
          # remote and has to be told.
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Triggering docs.yml against main so the deployment carries a branch ref."
          gh workflow run docs.yml --ref main
