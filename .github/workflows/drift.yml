# docs.yml pins `zensical`, `weasyprint` and `prodockit` exactly (see its
# own comment), so the published site and PDF only change when someone
# decides they should. The cost of pinning is going quietly stale: nothing
# says a newer release exists, or what it would do to the output.
#
# This closes that, on demand rather than on a schedule (see prodockit-
# extensions#145 for the version this is adapted from, which does run
# weekly). Builds the docs twice in one job - once with the pinned
# versions, once with the newest - and diffs the results byte for byte. If
# an upgrade would change the published output, or break the built-output
# tests, it opens an issue saying exactly what moved.
#
# The diff is meaningful because the builds are deterministic: two builds
# of identical inputs produce a byte-identical public/ and PDF (confirmed
# directly when the pins were introduced - see PR #141/#144's own
# investigation). The one trap is ordering - `zensical build` copies the
# PDF into public/, so it has to run *after* `prodockit pdf` or the copied
# PDF lags a generation and every comparison is a false positive.
#
# Reports rather than fails: a newer release is information, not a broken
# build.

name: Dependency drift

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      PANDOC_VERSION: "3.10.1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # One source of truth for the version a build uses:
          # pyenv and uv read this file too, so a reader's shell
          # picks the same interpreter without being told
          # (prodockit-extensions#363).
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt update
      - run: sudo apt install -y curl gnupg ca-certificates
      - run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt install -y /tmp/pandoc.deb
      - run: sudo apt install -y texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra fonts-inter fonts-jetbrains-mono
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      - run: sudo apt update
      - run: sudo apt install -y google-chrome-stable
      - run: npm ci --prefix tools/mermaid
      - run: npm ci --prefix tools/mathjax
      # prodockit.bibliography's citation style, which is not vendored -
      # docs.yml fetches it the same way, and without it *both* builds
      # here die before anything is compared:
      #
      #   BibliographyError: pandoc exited with status 99 ... File
      #   'harvard-cite-them-right.csl' not found in resource path
      #
      # So this job could never report drift; it only ever reported its
      # own missing file (prodockit-template#180).
      - run: curl -fsSL -o harvard-cite-them-right.csl "https://www.zotero.org/styles/harvard-cite-them-right"

      # Keep these in step with docs.yml's own install line.
      - name: Build with the pinned versions
        run: |
          pip install -r requirements.txt -r testrequirements.txt "zensical==0.0.53" "weasyprint==69.0" "prodockit==0.35.0"
          # Writes docs/javascripts/mathjax.js and its bundle from the npm
          # install above (issue #167) - needs `prodockit` on PATH, hence
          # after this pip install rather than beside the npm ci. Not
          # repeated in "Build with the newest versions" below: the bundle
          # comes from tools/mathjax, not from whichever prodockit gets
          # installed, so one write here covers both builds.
          prodockit init-mathjax
          prodockit pdf
          prodockit source-bundle
          zensical build --clean
          mkdir -p /tmp/pinned
          cp -R public /tmp/pinned/public
          cp docs/site_documentation.pdf /tmp/pinned/doc.pdf
          {
            echo "pinned_zensical=$(pip show zensical | awk '/^Version:/{print $2}')"
            echo "pinned_weasyprint=$(pip show weasyprint | awk '/^Version:/{print $2}')"
            echo "pinned_prodockit=$(pip show prodockit | awk '/^Version:/{print $2}')"
          } >> "$GITHUB_ENV"

      - name: Build with the newest versions
        run: |
          pip install -qU zensical weasyprint prodockit
          rm -rf public docs/source_bundle.pdf docs/site_documentation.pdf
          prodockit pdf
          prodockit source-bundle
          zensical build --clean
          {
            echo "latest_zensical=$(pip show zensical | awk '/^Version:/{print $2}')"
            echo "latest_weasyprint=$(pip show weasyprint | awk '/^Version:/{print $2}')"
            echo "latest_prodockit=$(pip show prodockit | awk '/^Version:/{print $2}')"
          } >> "$GITHUB_ENV"

      # Against the *newest* build, so a release that breaks the real
      # rendering checks is caught here rather than on the day someone
      # raises the pin. Never fails the job - the result is reported.
      - name: Run the built-output checks against the newest build
        id: tests
        continue-on-error: true
        run: python test/run_tests.py

      - name: Compare, and open an issue if anything moved
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -u
          pdf_state=$(cmp -s /tmp/pinned/doc.pdf docs/site_documentation.pdf \
            && echo "identical" || echo "**differs**")
          site_changed=$(diff -rq /tmp/pinned/public public 2>/dev/null | wc -l | tr -d ' ')

          versions_moved="no"
          [ "$pinned_zensical" != "$latest_zensical" ] && versions_moved="yes"
          [ "$pinned_weasyprint" != "$latest_weasyprint" ] && versions_moved="yes"
          [ "$pinned_prodockit" != "$latest_prodockit" ] && versions_moved="yes"

          if [ "$versions_moved" = "no" ]; then
            echo "Pins are current: zensical $pinned_zensical, weasyprint $pinned_weasyprint, prodockit $pinned_prodockit. Nothing to report."
            exit 0
          fi

          # One open issue at a time - a run that opens a fresh issue every
          # time someone triggers it is worse than no automation at all.
          existing=$(gh issue list --state open --search "in:title Dependency drift" \
            --json number --jq '.[0].number // empty')

          # Written to a file rather than captured with $( ), and passed as
          # --body-file. A heredoc inside command substitution is parsed for
          # quotes, so a single apostrophe in the prose would open one that
          # never closes and the whole script would fail to parse (see
          # prodockit-extensions#145, which hit exactly this). Backticks
          # still need escaping either way: the delimiter is unquoted so
          # that the version variables expand.
          cat > /tmp/drift-issue.md <<EOF
          A newer \`zensical\`, \`weasyprint\` or \`prodockit\` is available than the docs build pins.

          | | Pinned | Newest |
          |---|---|---|
          | \`zensical\` | $pinned_zensical | $latest_zensical |
          | \`weasyprint\` | $pinned_weasyprint | $latest_weasyprint |
          | \`prodockit\` | $pinned_prodockit | $latest_prodockit |

          Built the docs with each, in the same job, and compared byte for byte:

          - **PDF**: $pdf_state
          - **Website**: $site_changed files differ
          - **Built-output checks against the newest build**: $TESTS_OUTCOME

          Both builds used the same pandoc, Chrome, fonts and runner image, so
          any difference above is attributable to these three packages alone.

          A difference is not automatically a problem - when zensical last moved
          (0.0.51 -> 0.0.52), every page of the site changed (a bundled Font
          Awesome/Lucide icon-set bump redrew several icons) and the PDF came
          out byte-identical. The point is to decide, rather than have it
          arrive unnoticed.

          To take the upgrade: run \`prodockit pins\` (see CONTRIBUTING.md) to
          move every declaration together - \`requirements.txt\`'s floors, and
          the exact pins in \`.github/workflows/docs.yml\`/\`.gitlab-ci.yml\` -
          then rebuild and diff before committing.

          <sub>Opened by \`drift.yml\` (run on demand - see Actions -> Dependency
          drift -> Run workflow). Updated in place rather than reopened while
          this stays open.</sub>
          EOF

          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body-file /tmp/drift-issue.md
          else
            gh issue create \
              --title "Dependency drift: newer zensical/weasyprint/prodockit than the docs build pins" \
              --body-file /tmp/drift-issue.md
          fi
